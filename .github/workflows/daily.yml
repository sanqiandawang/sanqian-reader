name: Daily Pipeline

on:
  schedule:
    - cron: "0 22 * * *"  # 6:00 CST
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test DeepSeek connectivity
        run: |
          curl -s -w "\nHTTP %{http_code}" https://api.deepseek.com/v1/models -H "Authorization: Bearer ${{ secrets.DEEPSEEK_API_KEY }}" | tail -3
          python -c "
          import requests
          r = requests.get('https://api.deepseek.com/v1/models', headers={'Authorization': 'Bearer ${{ secrets.DEEPSEEK_API_KEY }}'}, timeout=10)
          print(f'Python requests: HTTP {r.status_code}')
          "

      - name: Run pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
          DEEPSEEK_MODEL: deepseek-chat
          SMTP_HOST: smtp.126.com
          SMTP_PORT: "465"
          SMTP_USER: z3647512@126.com
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          KINDLE_EMAIL: zhuaipi888@kindle.com
          REFRESH_TOKEN: sanqian2026
        run: python pipeline.py

      - name: Build static site
        run: python build_static.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
